- title: "Product Classifier Optimization"
  label: "Model deployment and optimization"
  year: "2024"
  summary: "Optimizing a ResNet18 product classifier for low-latency deployment with PyTorch, ONNX, pruning, and quantization."
  detail: "Benchmarked FP32, pruned, static INT8, and quantization-aware training paths, then compared accuracy, model size, latency, and throughput under ONNX Runtime."
  media_type: "benchmark"
  benchmark_title: "Latency comparison / per image"
  benchmark_note: "QAT INT8 keeps the highest accuracy while static INT8 ONNX gives the lowest latency."
  facts:
