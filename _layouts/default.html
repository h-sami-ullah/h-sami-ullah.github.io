<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b0a">
    {% seo %}
    <link rel="icon" type="image/png" href="{{ "/images/urc.png" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <nav class="nav" aria-label="Primary">
      <div class="container nav-inner">
        <a class="brand" href="{{ "/" | relative_url }}">
          <span class="brand-mark" aria-hidden="true">HS</span>
          <span class="brand-name">{{ site.title }}</span>
        </a>

        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-links">
          <span></span><span></span><span></span>
        </button>

        <div class="nav-links" id="nav-links">
          <a href="{{ "/" | relative_url }}#about">About</a>
          <a href="{{ "/" | relative_url }}#work">Work</a>
          <a href="{{ "/" | relative_url }}#reports">Reports</a>
          <a href="{{ "/" | relative_url }}#projects">Archive</a>
          <a href="{{ "/" | relative_url }}#publications">Research</a>
          <a href="{{ "/" | relative_url }}#skills">Toolkit</a>
          <a href="{{ "/" | relative_url }}#contact">Contact</a>
        </div>
      </div>
    </nav>

    <main id="main-content" tabindex="-1">
      {% if page.full_width %}
      {{ content }}
      {% else %}
      <div class="container page">
        {{ content }}
      </div>
      {% endif %}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }} &mdash; ML / Computer Vision Engineer</span>
        <div class="footer-links">
          <a href="https://github.com/hafiz-samiullah">GitHub</a>
          <a href="https://www.linkedin.com/in/hsamiullah/">LinkedIn</a>
          <a href="mailto:{{ site.email }}">Email</a>
        </div>
      </div>
    </footer>

    <div id="cursor-light" aria-hidden="true"></div>
    <canvas id="cursor-canvas" aria-hidden="true"></canvas>
    <script src="{{ "/assets/js/main.js" | relative_url }}" defer></script>
  </body>
</html>
