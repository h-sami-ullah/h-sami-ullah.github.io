<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" type="image/png" href="{{ "/images/urc.png" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  </head>
  <body>
    <nav class="nav">
      <div class="container nav-inner">
        <a class="brand" href="{{ "/" | relative_url }}">
          <img src="{{ site.logo | relative_url }}" alt="Logo" onerror="this.style.display='none'">
          <span>{{ site.title }}</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation" onclick="document.getElementById('navLinks').classList.toggle('open')">
          <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
          <a href="{{ "/" | relative_url }}#about">About</a>
          <a href="{{ "/" | relative_url }}#skills">Skills</a>
          <a href="{{ "/" | relative_url }}#projects">Projects</a>
          <a href="{{ "/" | relative_url }}#reports">Reports</a>
          <a href="{{ "/" | relative_url }}#publications">Publications</a>
          <a href="https://www.linkedin.com/in/hsamiullah/">LinkedIn</a>
          <a href="https://github.com/h-sami-ullah">GitHub</a>
        </div>
      </div>
    </nav>

    <main>
      {% if page.full_width %}
      {{ content }}
      {% else %}
      <div class="container page">
        {{ content }}
      </div>
      {% endif %}
    </main>

    <footer>
      <div class="container footer-inner">
        <span>&copy; {{ 'now' | date: "%Y" }} {{ site.title }} &mdash; Built with GitHub Pages</span>
        <div class="footer-links">
          <a href="https://github.com/h-sami-ullah">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            GitHub
          </a>
          <a href="https://www.linkedin.com/in/hsamiullah/">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.55C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.72C24 .77 23.2 0 22.22 0z"/></svg>
            LinkedIn
          </a>
          <a href="mailto:{{ site.email }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
            Email
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
